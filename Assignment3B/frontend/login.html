<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Nexus</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Welcome</h1>
    <p class="subtitle">Access your digital footprint</p>

    <div id="status" class="status-msg"></div>

    <div class="form-group">
        <input type="email" id="email" placeholder="Email Address">
    </div>
    <div class="form-group">
        <input type="password" id="password" placeholder="Password">
    </div>

    <button onclick="login()" id="loginBtn">Authenticate</button>

    <p class="footer-text">New here? <a href="register.html">Create Account</a></p>
    <p class="footer-text"><a href="index.html">← Back to Portal</a></p>
</div>

<script src="script.js"></script>
</body>
</html>
