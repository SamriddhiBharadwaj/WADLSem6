<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Employees</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f7f9fc;
        }

        .sidebar {
            height: 100vh;
            background: linear-gradient(180deg, #0d6efd, #084298);
            color: white;
        }

        .sidebar a {
            color: rgba(255, 255, 255, 0.85);
            padding: 12px;
            display: block;
            border-radius: 6px;
            margin-bottom: 6px;
            text-decoration: none;
        }

        .sidebar a.active,
        .sidebar a:hover {
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .card {
            border-radius: 12px;
            border: none;
        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <div class="row">


            <div class="col-md-2 sidebar p-4 vh-100">
                <h4 class="text-center mb-4">HR SYSTEM</h4>
                <a href="dashboard.html"><i class="fa fa-chart-line me-2"></i> Dashboard</a>
                <a class="active" href="employees.html"><i class="fa fa-users me-2"></i> Employees</a>
                <a href="department.html"><i class="fa fa-building me-2"></i> Departments</a>
                <a href="leave.html"><i class="fa fa-calendar me-2"></i> Leave</a>
                <a href="#"><i class="fa fa-gear me-2"></i> Settings</a>
            </div>


            <div class="col-md-10 p-4">
                <h2 class="mb-4">Employees</h2>

                <div class="card shadow-sm p-3">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Name</th>
                                <th>Department</th>
                                <th>Position</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>John Doe</td>
                                <td>IT</td>
                                <td>Software Engineer</td>
                                <td><span class="badge bg-success">Active</span></td>
                                <td>
                                    <button class="btn btn-sm btn-primary"><i class="fa fa-eye"></i></button>
                                    <button class="btn btn-sm btn-warning"><i class="fa fa-edit"></i></button>
                                </td>
                            </tr>
                            <tr>
                                <td>Jane Smith</td>
                                <td>HR</td>
                                <td>HR Manager</td>
                                <td><span class="badge bg-warning text-dark">On Leave</span></td>
                                <td>
                                    <button class="btn btn-sm btn-primary"><i class="fa fa-eye"></i></button>
                                    <button class="btn btn-sm btn-warning"><i class="fa fa-edit"></i></button>
                                </td>
                            </tr>
                            <tr>
                                <td>Samriddhi Bharadwaj</td>
                                <td>Finance</td>
                                <td>Quant Analyst</td>
                                <td><span class="badge bg-success">Active</span></td>
                                <td>
                                    <button class="btn btn-sm btn-primary"><i class="fa fa-eye"></i></button>
                                    <button class="btn btn-sm btn-warning"><i class="fa fa-edit"></i></button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>
</body>

</html>
